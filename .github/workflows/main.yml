name: SmartTracker CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Firestore emulator security rules tests (if present)
        run: |
          TEST_FILE=$(find . -maxdepth 5 -name "firestore.test.js" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$TEST_FILE" ]; then
            echo "firestore.test.js not found in repo; skipping Firestore rules tests."
            exit 0
          fi
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi
          npm install -g firebase-tools
          TEST_DIR=$(dirname "$TEST_FILE")
          (cd "$TEST_DIR" && firebase emulators:exec --only firestore "node --test firestore.test.js")

      - name: Compile Kotlin and run unit tests
        run: |
          GRADLEW_FILE=$(find . -maxdepth 5 -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_FILE" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_FILE")
            echo "Found gradlew in $PROJECT_DIR"
            cd "$PROJECT_DIR"
            chmod +x ./gradlew
            ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest
            exit 0
          fi

          GRADLE_BUILD=$(find . -maxdepth 5 \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)
          if [ -n "$GRADLE_BUILD" ]; then
            PROJECT_DIR=$(dirname "$GRADLE_BUILD")
            echo "gradlew not found; running system gradle in $PROJECT_DIR"
            cd "$PROJECT_DIR"
            gradle :app:compileDebugKotlin :app:testDebugUnitTest
            exit 0
          fi

          echo "No Android/Gradle project files found in repository; skipping Gradle build."
